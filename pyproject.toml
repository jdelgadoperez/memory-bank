[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-bank"
version = "0.5.4"
description = "Ingest and search Claude chat histories using a local vector DB"
requires-python = ">=3.11"
dependencies = [
    # Keep within one minor version of QDRANT_IMAGE in src/memory_bank/db.py —
    # the client warns against servers more than one minor version apart.
    # Intel macs on Python 3.14+ can't install fastembed>=0.9 (needs
    # onnxruntime>=1.24, which has no Intel-mac wheels), so they keep the
    # older floor; supported installs use Python 3.13 and get the pinned range.
    "qdrant-client[fastembed]>=1.19,<1.21; sys_platform != 'darwin' or platform_machine != 'x86_64' or python_version < '3.14'",
    "qdrant-client[fastembed]>=1.9.0,<1.21; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version >= '3.14'",
    "onnxruntime>=1.17.0",
    "onnxruntime<1.24.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "click>=8.1",
    "rich-click>=1.7",
    "anthropic>=0.40.0",
    "python-dateutil>=2.9",
    "rich>=13.0",
    "mcp>=1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
memory-bank = "memory_bank.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_bank = ["skills/*/SKILL.md"]

[project.optional-dependencies]
dev = ["ruff>=0.4", "watchfiles>=0.21", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["memory_bank"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
