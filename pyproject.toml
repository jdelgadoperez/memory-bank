[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-bank"
version = "0.5.2"
description = "Ingest and search Claude chat histories using a local vector DB"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client[fastembed]>=1.9.0",
    "onnxruntime>=1.17.0",
    "onnxruntime<1.24.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "click>=8.1",
    "rich-click>=1.7",
    "anthropic>=0.40.0",
    "python-dateutil>=2.9",
    "rich>=13.0",
    "mcp>=1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
memory-bank = "memory_bank.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_bank = ["skills/*/SKILL.md"]

[project.optional-dependencies]
dev = ["ruff>=0.4", "watchfiles>=0.21", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["memory_bank"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
