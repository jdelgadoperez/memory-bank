hooks:
  required_markers:
    Stop:
      - "memory-bank ingest claude-code >>"
      - "memory-bank distill"
    PreCompact:
      # The PreCompact command wraps the ingest in a subshell — e.g.
      # "( memory-bank ingest claude-code ) >> ... &  # precompact" — so the
      # ingest invocation and the "# precompact" identity comment are not a
      # single contiguous substring. Assert both fragments independently.
      - "memory-bank ingest claude-code"
      - "# precompact"
    UserPromptSubmit:
      - "memory-bank hooks recall"
    SessionStart:
      - "memory-bank hooks context-summary"
  marker_uniqueness:
    description: "Stop and PreCompact must not share an identical substring match"
    stop_unique_substring: "# precompact"

uv_receipt:
  # uv writes a [tool] table with 'requirements' and 'entrypoints' arrays.
  # The check asserts both arrays contain an entry naming the tool, and that
  # the entrypoint has a populated 'install-path'. See
  # scripts/release/assertions.py::check_uv_receipt for the exact shape.
  tool_name: "memory-bank"
  entrypoint_name: "memory-bank"

commands:
  exit_zero:
    - "memory-bank --version"
    - "memory-bank ingest claude-code"
    - "memory-bank hooks install --on all"
    - "memory-bank distill --dry-run"
    - "memory-bank update"
